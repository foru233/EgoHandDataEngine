[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "egohand-data-engine"
version = "0.1.0"
description = "Stereo hand reconstruction with explicit measurement provenance"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "opencv-contrib-python==4.11.0.86", "mediapipe==0.10.21", "PySide6==6.8.3", "pyqtgraph==0.13.7", "PyOpenGL==3.1.9", "PyYAML==6.0.2", "psutil==7.0.0", "matplotlib==3.11.2", "jax==0.4.35", "jaxlib==0.4.35"]

[project.scripts]
egohand-studio = "egohand.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"egohand.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["assets: requires downloaded official model and licensed image", "gui: Qt GUI integration"]
